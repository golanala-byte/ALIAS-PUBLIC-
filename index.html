:root{
  --cobalt:#1D3F8F;--lemon:#F2C230;--green:#3E8A5B;--glaze:#F7F9FB;--ink:#1A2340;--mang:#5B3A6E;
  --bg:var(--glaze);--fg:var(--ink);--muted:#56607A;--line:#C9D2E3;--surface:#FFFFFF;--accent:var(--cobalt);
  --num:var(--cobalt);--display:"Suez One","Times New Roman",serif;--ui:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root.night{--num:var(--lemon);--bg:#0F2250;--fg:#E9EEF8;--muted:#9FB0D4;--line:#2D4C94;--surface:#16306B;--accent:#9DB6F0}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:16px 16px 20px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.15}
h2{font-size:1.7rem;margin-bottom:4px}
p{margin:0}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;min-height:44px}
.back{font-size:1rem;color:var(--accent);padding:10px 0;font-weight:700}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:12px 18px;border-radius:6px;font-weight:800;font-size:1.15rem;border:2px solid var(--accent);color:var(--accent);width:100%}
.btn.primary{background:var(--lemon);border-color:var(--lemon);color:var(--ink)}
.btn.solid{background:var(--cobalt);border-color:var(--cobalt);color:#fff}
:root.night .btn.solid{background:#F7F9FB;border-color:#F7F9FB;color:var(--ink)}
.btn.small{min-height:44px;font-size:1rem;padding:8px 12px;font-weight:700}
.btn.ghost{border-color:transparent}
.choice{display:flex;flex-direction:column;align-items:flex-start;text-align:right;gap:2px;padding:16px 18px;border:2px solid var(--line);border-radius:6px;width:100%;background:var(--surface)}
.choice b{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--fg)}
.choice span{color:var(--muted);font-size:1rem}
.choice:not(:disabled):active{border-color:var(--lemon)}
.seg{display:flex;border:2px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{flex:1;min-height:50px;font-weight:700;font-size:1.05rem;border-inline-start:2px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed=true]{background:var(--cobalt);color:#fff}
:root.night .seg button[aria-pressed=true]{background:#F7F9FB;color:var(--ink)}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.field>label,.field>.lbl{font-weight:800;font-size:1.05rem}
.field .hint{color:var(--muted);font-size:.95rem}
input[type=text]{font:inherit;font-size:1.2rem;padding:12px 14px;border:2px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:100%;-webkit-user-select:text;user-select:text}
.check{display:flex;align-items:center;gap:12px;min-height:48px;font-size:1.1rem}
.check input{width:24px;height:24px;accent-color:var(--cobalt)}
.foot{margin-top:auto;padding-top:22px;display:flex;gap:10px}
.toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:14px 16px;border-radius:6px;font-weight:700;text-align:center;z-index:9;max-width:528px;margin:0 auto}
:root.night .toast{background:#F7F9FB;color:var(--ink)}

/* brand strip */
.brand{padding:18px 0 26px}
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin-bottom:18px}
.strip svg{width:100%;height:auto;display:block}
.brand h1{font-size:4.2rem;letter-spacing:-.01em}
.brand p{font-family:var(--display);font-size:1.6rem;color:var(--accent);margin-top:-6px}

.qr{width:190px;margin:4px auto 6px;background:#fff;padding:6px;border-radius:4px;line-height:0}
.qr svg{width:100%;height:auto;display:block}
/* tiles */
.tile{display:block}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.levels button{padding:0;border:3px solid transparent;border-radius:4px;line-height:0}
.levels button[aria-pressed=true]{border-color:var(--lemon)}
.levels svg{width:100%;height:auto}

/* teams */
.teams{display:flex;flex-wrap:wrap;gap:8px}
.teams button{display:flex;align-items:center;gap:8px;padding:10px 14px;border:2px solid var(--line);border-radius:6px;min-height:52px;font-weight:700;flex:1 1 40%}
.teams button[aria-pressed=true]{border-color:var(--lemon);background:var(--surface)}
.tok{width:22px;height:22px;flex:none}

/* board */
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin:6px 0 16px}
.sq{position:relative;aspect-ratio:1}
.sq svg.tile{width:100%;height:100%}
.sq .toks{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:8%}
.sq .toks svg{width:96%;height:auto;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff)}
.sq.on{outline:3px solid var(--lemon);outline-offset:-1px;z-index:1}
.sq.fin::after{content:"סוף";position:absolute;inset:auto 0 -2px 0;text-align:center;font-size:.6rem;font-weight:800;color:#fff;background:var(--ink)}
.standing{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.standing>.row{justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.next{border:2px solid var(--lemon);border-radius:6px;padding:14px;margin-bottom:12px}
.next h3{font-size:1.4rem}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* turn */
.turn{flex:1;display:flex;flex-direction:column}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.clock{font-family:var(--display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:6px}
.clock.low{background:var(--lemon);color:var(--ink)}
.counts{display:flex;gap:14px;font-weight:800;font-size:1.1rem}
.counts span b{font-family:var(--display);font-weight:400;font-size:1.6rem;margin-inline-start:4px}
.lvl{width:46px;flex:none}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0;perspective:900px}
.word{position:relative;width:100%;aspect-ratio:1;max-height:62vh;background:var(--glaze);color:var(--ink);border:4px solid var(--cobalt);outline:2px solid var(--cobalt);outline-offset:4px;border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22%}
.word .c{position:absolute;width:22%;aspect-ratio:1}
.word .c svg{width:100%;height:100%}
.word .c1{top:6px;right:6px}.word .c2{top:6px;left:6px}.word .c3{bottom:6px;right:6px}.word .c4{bottom:6px;left:6px}
.word .t{font-family:var(--display);line-height:1.1;word-break:keep-all;overflow-wrap:anywhere}
.word .t.xl{font-size:clamp(2.8rem,15vw,5rem)}.word .t.l{font-size:clamp(2.2rem,11vw,3.8rem)}.word .t.m{font-size:clamp(1.8rem,8.5vw,3rem)}.word .t.s{font-size:clamp(1.5rem,7vw,2.4rem)}
.word .h{display:block;font-family:var(--ui);font-weight:700;font-size:1.1rem;color:#56607A;margin-top:8px}
.flip{animation:flip .42s ease-out}
@keyframes flip{from{transform:rotateY(-90deg)}to{transform:rotateY(0)}}
.actions{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.actions .btn{min-height:84px;font-size:1.5rem;font-family:var(--display);font-weight:400}
.minor{display:flex;justify-content:space-between;margin-bottom:8px}
.minor button{color:var(--muted);font-size:.95rem;padding:10px 4px;font-weight:700}
.big-num{font-family:var(--display);font-size:7rem;line-height:1;color:var(--num);text-align:center;margin:14px 0}
.center{text-align:center}
.bang{font-family:var(--display);font-size:2.2rem;text-align:center;color:var(--num);margin:6px 0 4px}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line);margin:14px 0}
.list button,.list .li{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);font-size:1.05rem;text-align:right;width:100%}
.tag{font-weight:800;font-size:.9rem;padding:2px 10px;border-radius:4px}
.tag.g{background:var(--lemon);color:var(--ink)}
.tag.s{border:2px solid var(--muted);color:var(--muted)}
.net{font-family:var(--display);font-size:4rem;text-align:center;line-height:1}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px}
.stepper button{width:64px;height:64px;border:2px solid var(--accent);border-radius:6px;font-size:2rem;font-weight:800;color:var(--accent)}
.stepper output{font-family:var(--display);font-size:3.4rem;min-width:110px;text-align:center}
@media (prefers-reduced-motion:reduce){.flip{animation:none}}

<body>
<div id="app"></div>
<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],

cat":"אוכל","src":"base"},{"w":"בירה","d":2,"cat":"אוכל","src":"base"},{"w":"יין","d":2,"cat":"אוכל","src":"base"},{"w":"שמפניה","d":2,"cat":"אוכל","src":"base"},{"w":"תזמורת","d":2,"cat":"פנאי","src":"base"},{"w":"כדורעף","d":2,"cat":"פנאי","src":"base"},{"w":"טניס שולחן","d":2,"cat":"פנאי","src":"base"},{"w":"באולינג","d":2,"cat":"פנאי","src":"base"},{"w":"גולף","d":2,"cat":"פנאי","src":"base"},{"w":"כדור יד","d":2,"cat":"פנאי","src":"base"},{"w":"סקי","d":2,"cat":"פנאי","src":"base"},{"w":"פיקניק","d":2,"cat":"פנאי","src":"base"},{"w":"קמפינג","d":2,"cat":"פנאי","src":"base"},{"w":"חניון","d":2,"cat":"פנאי","src":"base"},{"w":"חמנייה","d":1,"cat":"חפצים","src":"base"},{"w":"ספל","d":1,"cat":"חפצים","src":"base"},{"w":"סכו\"ם","d":1,"cat":"חפצים","src":"base"},{"w":"מגבון","d":1,"cat":"חפצים","src":"base"},{"w":"נייר טואלט","d":1,"cat":"חפצים","src":"base"},{"w":"תרופה","d":1,"cat":"חפצים","src":"base"},{"w":"שעון קיר","d":1,"cat":"חפצים","src":"base"},{"w":"לוח שנה","d":1,"cat":"חפצים","src":"base"},{"w":"גלגל","d":1,"cat":"חפצים","src":"base"},{"w":"מכונת קפה","d":1,"cat":"חפצים","src":"base"},{"w":"משקפי שחייה","d":1,"cat":"חפצים","src":"base"},{"w":"סלסלה","d":1,"cat":"חפצים","src":"base"},{"w":"צלחת מעופפת","d":2,"cat":"חפצים","src":"base"},{"w":"מגדל אייפל","d":2,"cat":"חפצים","src":"base"},{"w":"פסל החירות","d":2,"cat":"חפצים","src":"base"},{"w":"מכונית מרוץ","d":2,"cat":"חפצים","src":"base"},{"w":"רכבת תחתית","d":2,"cat":"חפצים","src":"base"},{"w":"מטוס נייר","d":2,"cat":"חפצים","src":"base"},{"w":"צוללן","d":2,"cat":"חפצים","src":"base"}]</script>
<script>
"use strict";
const LS={get(k,d){try{const v=localStorage.getItem("alias."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("alias."+k,JSON.stringify(v))}catch(e){}}};
const WORDS=JSON.parse(document.getElementById("words").textContent);
const DEF={turn:90,skip:"minus",skipLimit:3,teams:2,packs:{italy:true,israeli:true,movies:true,family:true},mix:20,night:true};
let S=Object.assign({},DEF,LS.get("settings",{}));S.packs=Object.assign({},DEF.packs,S.packs||{});
let seen=new Set(LS.get("seen",[])),removed=new Set(LS.get("removed",[])),custom=LS.get("custom",[]);
let game=LS.get("game",null),turn=LS.get("turn",null);
let screen="home",ui={},anim=null,swReady=false;
const VERSION="1.5";
const saveS=()=>LS.set("settings",S),saveGame=()=>LS.set("game",game),saveTurn=()=>LS.set("turn",turn);
const PACKS={italy:"איטליה",israeli:"ישראליות",movies:"סרטים וסדרות",family:"משפחתית"};
const LENS={24:"קצר",40:"בינוני",56:"ארוך"};
const TEAM=[{c:"#2F5BD0",n:"הכחולים",s:"circle"},{c:"#F2C230",n:"הצהובים",s:"square"},{c:"#3E8A5B",n:"הירוקים",s:"triangle"},{c:"#8A4FB0",n:"הסגולים",s:"diamond"}];
const sgn=n=>(n>0?"+":"")+n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const teamName=i=>game&&game.teams[i]?game.teams[i].name:TEAM[i].n;

/* ---------- tiles ---------- */
const C={b:"#1D3F8F",y:"#F2C230",g:"#3E8A5B",w:"#F7F9FB"};
function star(cx,cy,r1,r2,n){let p=[];for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=Math.PI*i/n-Math.PI/2;p.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1))}return p.join(" ")}
function motif(n){
  switch(n){
  case 1:return `<ellipse cx="48" cy="56" rx="24" ry="17" fill="${C.y}" transform="rotate(-28 48 56)"/><path d="M60 38q16-14 26-3q-10 13-26 3z" fill="${C.g}"/><circle cx="16" cy="16" r="4" fill="${C.b}"/><circle cx="84" cy="84" r="4" fill="${C.b}"/>`;
  case 2:return `<g fill="${C.b}"><ellipse cx="50" cy="28" rx="11" ry="19"/><ellipse cx="50" cy="72" rx="11" ry="19"/><ellipse cx="28" cy="50" rx="19" ry="11"/><ellipse cx="72" cy="50" rx="19" ry="11"/></g><circle cx="50" cy="50" r="10" fill="${C.y}"/><g fill="${C.g}"><circle cx="20" cy="20" r="6"/><circle cx="80" cy="20" r="6"/><circle cx="20" cy="80" r="6"/><circle cx="80" cy="80" r="6"/></g>`;
  case 3:return `<polygon points="${star(50,50,40,18,8)}" fill="${C.b}"/><polygon points="${star(50,50,18,9,8)}" fill="${C.y}"/>`;
  case 4:return `<g fill="${C.b}"><path d="M8 8h28a28 28 0 0 1-28 28z"/><path d="M92 8v28a28 28 0 0 1-28-28z"/><path d="M8 92v-28a28 28 0 0 1 28 28z"/><path d="M92 92h-28a28 28 0 0 1 28-28z"/></g><circle cx="50" cy="50" r="17" fill="${C.g}"/><circle cx="50" cy="50" r="7" fill="${C.y}"/>`;
  case 5:return `<polygon points="50,8 92,50 50,92 8,50" fill="${C.b}"/><polygon points="50,26 74,50 50,74 26,50" fill="${C.y}"/><polygon points="50,40 60,50 50,60 40,50" fill="${C.g}"/>`;
  case 6:return `<g fill="none" stroke="${C.b}" stroke-width="7" stroke-linecap="round"><path d="M10 30q10-12 20 0t20 0t20 0t20 0"/><path d="M10 52q10-12 20 0t20 0t20 0t20 0"/><path d="M10 74q10-12 20 0t20 0t20 0t20 0"/></g>`;
  case 7:return `<g fill="${C.g}"><path d="M50 50q-30-4-34-34q30 4 34 34z"/><path d="M50 50q30-4 34-34q-30 4-34 34z"/><path d="M50 50q-30 4-34 34q30-4 34-34z"/><path d="M50 50q30 4 34 34q-30-4-34-34z"/></g><circle cx="50" cy="50" r="9" fill="${C.b}"/><g fill="${C.y}"><circle cx="50" cy="14" r="5"/><circle cx="50" cy="86" r="5"/><circle cx="14" cy="50" r="5"/><circle cx="86" cy="50" r="5"/></g>`;
  default:{let r="";for(let i=0;i<12;i++){const a=Math.PI*i/6;r+=`<line x1="${(50+22*Math.cos(a)).toFixed(1)}" y1="${(50+22*Math.sin(a)).toFixed(1)}" x2="${(50+40*Math.cos(a)).toFixed(1)}" y2="${(50+40*Math.sin(a)).toFixed(1)}"/>`}
    return `<g stroke="${C.b}" stroke-width="6" stroke-linecap="round">${r}</g><circle cx="50" cy="50" r="17" fill="${C.y}"/><circle cx="50" cy="50" r="7" fill="${C.g}"/>`}
  }
}
function tile(n,num=true,title=""){return `<svg class="tile" viewBox="0 0 100 100" role="img" aria-label="${title||"משבצת "+n}"><rect x="1.5" y="1.5" width="97" height="97" fill="${C.w}" stroke="${C.b}" stroke-width="3"/>${motif(n)}${num?`<text x="89" y="21" text-anchor="middle" font-family="Suez One,serif" font-size="17" fill="${C.b}" stroke="${C.w}" stroke-width="4" paint-order="stroke">${n}</text>`:""}</svg>`}
function token(i){const t=TEAM[i],st=`fill="${t.c}" stroke="#0E1A3A" stroke-width="7"`;let sh;
  if(t.s==="circle")sh=`<circle cx="50" cy="50" r="40" ${st}/><circle cx="50" cy="50" r="12" fill="#fff"/>`;
  else if(t.s==="square")sh=`<rect x="12" y="12" width="76" height="76" ${st}/><rect x="40" y="40" width="20" height="20" fill="#0E1A3A"/>`;
  else if(t.s==="triangle")sh=`<polygon points="50,8 94,88 6,88" ${st}/><circle cx="50" cy="62" r="10" fill="#fff"/>`;
  else sh=`<polygon points="50,6 94,50 50,94 6,50" ${st}/><polygon points="50,36 64,50 50,64 36,50" fill="#fff"/>`;
  return `<svg class="tok" viewBox="0 0 100 100" aria-hidden="true">${sh}</svg>`}
const levelOf=pos=>((pos-1)%8)+1;

/* ---------- words ---------- */
function pool(){return WORDS.concat(custom)}
function pick(level){
  const all=pool(),ok=w=>w.d===level&&!seen.has(w.w)&&!removed.has(w.w);
  const base=all.filter(w=>w.src==="base"&&ok(w)),pk=all.filter(w=>w.src!=="base"&&S.packs[w.src]&&ok(w));
  let p=(pk.length&&(Math.random()*100<S.mix||!base.length))?pk:base;
  if(!p.length){
    const lv=all.filter(w=>w.d===level&&!removed.has(w.w));if(!lv.length)return {w:"אין מילים ברמה הזו",d:level};
    lv.forEach(w=>seen.delete(w.w));LS.set("seen",[...seen]);toast("כל המילים ברמה "+level+" כבר יצאו. הרמה אופסה.");return pick(level)}
  const w=p[Math.floor(Math.random()*p.length)];seen.add(w.w);LS.set("seen",[...seen]);return {w:w.w,d:w.d};
}
function wordHTML(w,level,flip){
  const m=w.match(/^(.*?)\s*\((.+)\)$/),main=m?m[1]:w,hint=m?m[2]:"",L=main.length;
  const sz=L<=6?"xl":L<=10?"l":L<=16?"m":"s",c=tile(level,false,"");
  return `<div class="word${flip?" flip":""}"><span class="c c1">${c}</span><span class="c c2">${c}</span><span class="c c3">${c}</span><span class="c c4">${c}</span><div><div class="t ${sz}">${esc(main)}</div>${hint?`<span class="h">${esc(hint)}</span>`:""}</div></div>`;
}

/* ---------- turn timing ---------- */
const now=()=>Date.now(),pad=n=>String(n).padStart(2,"0");
function nextQuarter(){const t0=now();let t=Math.ceil(t0/15000)*15000;while(t-t0<12000)t+=15000;return t}
function fromSecond(sec){const t0=now(),base=Math.floor(t0/60000)*60000+sec*1000;for(const t of [base-60000,base,base+60000])if(t>=t0-20000)return t;return base+60000}
function phase(){if(!turn)return null;const t=now();if(t<turn.start)return "wait";if(t<turn.start+turn.dur)return "run";if(turn.role==="explain"&&turn.last==null)return "last";return turn.role==="explain"?"done":"end"}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+pad(s%60)}
function tally(){const g=turn.marks.filter(m=>m.r==="g").length,s=turn.marks.filter(m=>m.r==="s").length;return {g,s,net:turn.skip==="minus"?g-s:g}}
let wake=null;async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null)}if(!on&&wake){await wake.release();wake=null}}catch(e){}}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- screens ---------- */
const V={};
const hdr=(back,title="")=>`<div class="top"><button class="back" data-act="go" data-v="${back}">חזרה</button><div class="grow"></div>${title}</div>`;
V.home=()=>`<header class="brand"><div class="strip">${[1,2,3,4,5,6,7,8].map(n=>tile(n,false,"")).join("")}</div><h1>אליאס</h1><p>בדיגיטל</p></header>
<div class="stack">
<button class="choice" data-act="go" data-v="flight"><b>טיסה</b><span>בלי אינטרנט. כל טלפון עצמאי, מתאמים ב-Bitchat</span></button>
<button class="choice" data-act="sync" data-v="room"><b>יחד בחדר</b><span>עם אינטרנט. הכל מסונכרן בין הטלפונים</span></button>
<button class="choice" data-act="sync" data-v="remote"><b>מרחוק</b><span>עם אינטרנט, ושיחת וואטסאפ או זום במקביל</span></button>
</div>
<p class="muted center" style="margin-top:16px">${swReady?"מוכן לעבודה בלי אינטרנט":"&nbsp;"} · גרסה ${VERSION}</p>
<div class="foot"><button class="btn small" data-act="go" data-v="settings">הגדרות</button><button class="btn small" data-act="go" data-v="addword">הוספת מילה</button></div>`;
V.flight=()=>`${hdr("home")}<h2>מה הטלפון הזה עושה?</h2><p class="muted" style="margin-bottom:18px">טלפון אחד בלבד הוא המזכיר. כל השאר שחקנים.</p>
<div class="stack">
<button class="choice" data-act="role" data-v="sec"><b>מזכיר</b><span>מנהל את הלוח והניקוד. יכול גם להסביר בתורו</span></button>
<button class="choice" data-act="role" data-v="player"><b>שחקן</b><span>מסביר בתורו, ומצטרף לטיימר בתורות של אחרים</span></button>
</div>`;
V.player=()=>`${hdr("flight")}<h2>שחקן</h2><p class="muted" style="margin-bottom:18px">תור ${S.turn} שניות, ${S.teams} קבוצות. אפשר לשנות בהגדרות.</p>
<div class="stack"><button class="choice" data-act="go" data-v="pick"><b>התחל תור</b><span>אני המסביר עכשיו</span></button>
<button class="choice" data-act="go" data-v="join"><b>הצטרף לתור</b><span>מישהו אחר מסביר, ואני רוצה לראות את הטיימר</span></button></div>`;
V.pick=()=>{const n=game&&ui.fromSec?game.teams.length:S.teams;if(ui.team==null)ui.team=0;
  return `${hdr(ui.fromSec?"board":"player")}<h2>התחל תור</h2>
<div class="field"><span class="lbl">איזו קבוצה מסבירה?</span><div class="teams">${Array.from({length:n},(_,i)=>`<button data-act="pteam" data-v="${i}" aria-pressed="${ui.team===i}">${token(i)}${esc(teamName(i))}</button>`).join("")}</div></div>
<div class="field"><span class="lbl">על איזו משבצת הקבוצה עומדת?</span><span class="hint">המספר קובע את רמת הקושי. המזכיר יודע.</span>
<div class="levels">${[1,2,3,4,5,6,7,8].map(k=>`<button data-act="plevel" data-v="${k}" aria-pressed="${ui.level===k}">${tile(k)}</button>`).join("")}</div></div>
<div class="foot"><button class="btn primary" data-act="startTurn" ${ui.level?"":"disabled"}>התחל תור</button></div>`};
V.join=()=>`${hdr("player")}<h2>הצטרף לתור</h2><p class="muted" style="margin-bottom:18px">איזה מספר המסביר כתב ב-Bitchat?</p>
<div class="levels">${[0,15,30,45].map(s=>`<button class="btn solid" style="min-height:84px;font-family:var(--display);font-size:2rem;font-weight:400;line-height:1" data-act="joinSec" data-v="${s}">${pad(s)}</button>`).join("")}</div>
<p class="muted" style="margin-top:18px">הטיימר יתחיל בשנייה הזו בדיוק, לפי השעון של הטלפון.</p>`;
V.turn=()=>{const ph=phase();
  if(!turn){return V.home()}
  if(turn.role==="watch"){

  if(ph==="last"){const n=turn.teams;
    return `<div class="turn"><div class="bang">מילה אחרונה, כולם מנחשים!</div><div class="stage" style="padding:10px 0">${wordHTML(turn.cur?turn.cur.w:"",turn.level,false)}</div>
<p class="center" style="font-weight:800;margin-bottom:10px">מי ניחש ראשון?</p><div class="teams">${Array.from({length:n},(_,i)=>`<button data-act="lastTeam" data-v="${i}">${token(i)}${esc(turn.names?turn.names[i]:TEAM[i].n)}</button>`).join("")}<button data-act="lastTeam" data-v="-1">אף אחד</button></div></div>`}

};
V.secSetup=()=>{if(!ui.setup)ui.setup={n:S.teams,names:TEAM.map(t=>t.n),len:40};const u=ui.setup;

function boardHTML(disp,len){const L=len||(game&&game.len);let cells=[];

    if(r%2)row.reverse();cells.push(...row)}
  return `<div class="board" id="board">${cells.join("")}</div>`}

<div class="standing">${game.teams.map((t,i)=>`<div class="row"><span class="row">${token(i)}<b>${esc(t.name)}</b></span><span class="muted">משבצת ${t.pos} מתוך ${game.len}</span></div>`).join("")}</div>
<div class="next"><p class="muted">התור הבא</p><h3 class="row" style="margin:4px 0 12px">${token(nx)}${esc(game.teams[nx].name)}, משבצת ${pos} (רמה ${levelOf(pos)})</h3>
<div class="stack"><button class="btn primary" data-act="go" data-v="report">הזן תוצאת תור</button><button class="btn small" data-act="explainHere">להסביר מהטלפון הזה</button></div></div>
<div class="tools"><button class="btn small" data-act="undoTurn" ${game.hist.length?"":"disabled"}>בטל תור אחרון</button><button class="btn small" data-act="go" data-v="fix">תיקון ניקוד</button><button class="btn small" data-act="skipTurn">העבר תור</button><button class="btn small" data-act="resetGame">משחק חדש</button></div>`};
V.report=()=>{if(!ui.rep)ui.rep={team:game.next,net:0,last:null};const r=ui.rep;

<div class="field"><span class="lbl">מי הסביר?</span><div class="teams">${game.teams.map((t,i)=>`<button data-act="rt" data-v="${i}" aria-pressed="${r.team===i}">${token(i)}${esc(t.name)}</button>`).join("")}</div></div>
<div class="field"><span class="lbl">ניקוד נטו</span><div class="stepper"><button data-act="rn" data-v="-1" aria-label="פחות">−</button><output dir="ltr">${sgn(r.net)}</output><button data-act="rn" data-v="1" aria-label="יותר">+</button></div></div>
<div class="field"><span class="lbl">מילה אחרונה: מי ניחש?</span><div class="teams">${game.teams.map((t,i)=>`<button data-act="rl" data-v="${i}" aria-pressed="${r.last===i}">${token(i)}${esc(t.name)}</button>`).join("")}<button data-act="rl" data-v="-1" aria-pressed="${r.last===-1}">אף אחד</button></div></div>
<div class="foot"><button class="btn primary" data-act="applyReport" ${r.last==null?"disabled":""}>עדכן לוח</button></div>`};
V.fix=()=>`${hdr("board")}<h2>תיקון ניקוד</h2><p class="muted" style="margin-bottom:16px">מזיז קבוצה על הלוח בלי לרשום תור.</p>
${game.teams.map((t,i)=>`<div class="field"><span class="lbl row">${token(i)}${esc(t.name)}</span><div class="stepper"><button data-act="fx" data-i="${i}" data-v="-1">−</button><output>${t.pos}</output><button data-act="fx" data-i="${i}" data-v="1">+</button></div></div>`).join("")}`;
V.win=()=>{const w=game.teams[game.winner];return `<div class="stage" style="flex-direction:column;gap:14px">${token(game.winner).replace('class="tok"','class="tok" style="width:96px;height:96px"')}<h2 style="font-size:2.6rem;text-align:center">${esc(w.name)} ניצחו!</h2></div>
<div class="standing">${game.teams.map((t,i)=>`<div class="row"><span class="row">${token(i)}<b>${esc(t.name)}</b></span><span class="muted">משבצת ${Math.min(t.pos,game.len)}</span></div>`).join("")}<div class="row"><span>תורות שנשחקו</span><span class="muted">${game.hist.length}</span></div></div>
<div class="foot" style="flex-direction:column"><button class="btn primary" data-act="rematch">משחק חוזר עם אותן קבוצות</button><button class="btn small" data-act="resetGame">משחק חדש</button></div>`};
V.settings=()=>{const cnt=s=>WORDS.filter(w=>w.src===s).length+(s==="family"?custom.length:0);
  return `${hdr("home")}<h2>הגדרות</h2><p class="muted" style="margin-bottom:20px">כולם צריכים אותן הגדרות. נשמר בטלפון הזה.</p>
<div class="field"><span class="lbl">זמן תור</span><div class="seg">${[60,90,120].map(v=>`<button data-act="set" data-k="turn" data-v="${v}" aria-pressed="${S.turn===v}">${v} שניות</button>`).join("")}</div></div>
<div class="field"><span class="lbl">דילוג</span><div class="seg">${[["minus","מינוס נקודה"],["none","בלי עונש"],["limit","מוגבל"]].map(([v,t])=>`<button data-act="set" data-k="skip" data-v="${v}" aria-pressed="${S.skip===v}">${t}</button>`).join("")}</div>
${S.skip==="limit"?`<div class="seg">${[1,2,3,4,5].map(v=>`<button data-act="set" data-k="skipLimit" data-v="${v}" aria-pressed="${S.skipLimit===v}">${v}</button>`).join("")}</div><span class="hint">דילוגים מותרים בכל תור</span>`:""}</div>
<div class="field"><span class="lbl">מספר קבוצות</span><div class="seg">${[2,3,4].map(v=>`<button data-act="set" data-k="teams" data-v="${v}" aria-pressed="${S.teams===v}">${v}</button>`).join("")}</div></div>
<div class="field"><span class="lbl">חבילות נושא</span>${Object.entries(PACKS).map(([k,t])=>`<label class="check"><input type="checkbox" data-pack="${k}" ${S.packs[k]?"checked":""}>${t} <span class="muted">(${cnt(k)})</span></label>`).join("")}</div>
<div class="field"><span class="lbl">כמה מהמילים מהחבילות</span><div class="seg">${[0,10,20,30,50].map(v=>`<button data-act="set" data-k="mix" data-v="${v}" aria-pressed="${S.mix===v}">${v}%</button>`).join("")}</div></div>
<div class="field"><label class="check"><input type="checkbox" data-night ${S.night?"checked":""}>מצב לילה</label></div>

V.addword=()=>{if(ui.nwLevel==null)ui.nwLevel=0;return `${hdr("home")}<h2>הוספת מילה</h2><p class="muted" style="margin-bottom:18px">מילה משפחתית נכנסת לחבילה "משפחתית" בטלפון הזה.</p>
<div class="field"><label for="nw">המילה</label><input type="text" id="nw" maxlength="40" autocomplete="off"></div>
<div class="field"><span class="lbl">רמת קושי</span><span class="hint">1 חפץ יומיומי, 8 ניב או ביטוי</span><div class="levels">${[1,2,3,4,5,6,7,8].map(k=>`<button data-act="nwl" data-v="${k}" aria-pressed="${ui.nwLevel===k}">${tile(k)}</button>`).join("")}</div></div>
<button class="btn primary" data-act="addWord">הוסף מילה</button>
${custom.length?`<div class="list">${custom.map((w,i)=>`<div class="li"><span>${esc(w.w)} <span class="muted">(${w.d})</span></span><button class="btn small ghost" style="width:auto" data-act="delWord" data-v="${i}">מחק</button></div>`).join("")}</div>`:""}`};

/* ---------- render / tick ---------- */
function render(){document.documentElement.classList.toggle("night",!!S.night);const f=V[screen]||V.home;document.getElementById("app").innerHTML=f();ui.ph=phase();window.scrollTo(0,0)}
function go(s){screen=s;render()}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
let lastBuzz=null;
setInterval(()=>{if(screen==="sync"){syTick();return}
  if(screen!=="turn"||!turn)return;const ph=phase();
  if(ph!==ui.ph){if(ph==="run"){keepAwake(true);buzz(200)}if(ph==="last"||ph==="end"){buzz([400,120,400]);keepAwake(false)}render();return}
  const cd=document.getElementById("cd");if(cd)cd.textContent=Math.max(0,Math.ceil((turn.start-now())/1000));
  const ck=document.getElementById("clock");if(ck){const left=turn.start+turn.dur-now();ck.textContent=fmt(left);const low=left<=10000;ck.classList.toggle("low",low);if(low&&lastBuzz!==turn.start){lastBuzz=turn.start;buzz(120)}}
},200);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&SY&&FB.api&&syG())FB.api.set("games/"+SY.code+"/players/"+SY.uid+"/online",true);
  if(!document.hidden&&screen==="turn"){if(phase()==="run")keepAwake(true);render()}});

/* ---------- game logic ---------- */
function newTurn(role,start,extra){turn=Object.assign({role,start,dur:S.turn*1000,skip:S.skip,limit:S.skipLimit,teams:S.teams,marks:[],cur:null,last:null},extra);saveTurn();go("turn")}
function applyResult(team,net,last){
  game.hist.push({pos:game.teams.map(t=>t.pos),next:game.next});
  const from=game.teams.map(t=>t.pos);
  game.teams[team].pos=Math.max(1,game.teams[team].pos+net);
  if(last>=0)game.teams[last].pos+=1;
  const winners=game.teams.map((t,i)=>t.pos>=game.len?i:-1).filter(i=>i>=0);
  if(winners.length)game.winner=winners.includes(team)?team:winners[0];
  game.next=(team+1)%game.teams.length;saveGame();animate(from);
}
function animate(from){const to=game.teams.map(t=>Math.min(t.pos,game.len));ui.disp=from.map(p=>Math.min(p,game.len));const w=game.winner;game.winner=null;screen="board";render();
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const done=()=>{clearInterval(anim);anim=null;ui.disp=null;game.winner=w;render()};
  if(reduce)return done();
  anim=setInterval(()=>{let moved=false;ui.disp=ui.disp.map((p,i)=>{if(p!==to[i]){moved=true;return p+(to[i]>p?1:-1)}return p});
    if(!moved)return setTimeout(done,500);const b=document.getElementById("board");if(b)b.outerHTML=boardHTML(ui.disp)},260);
}

/* ---------- actions ---------- */
const A={
  go:v=>{if(v==="report")ui.rep=null;if(v==="pick"){ui.fromSec=false;ui.level=null}go(v)},
  role:v=>{if(turn&&phase()!=="done"&&phase()!=="end"){go("turn");return}if(v==="sec")go(game?"board":"secSetup");else go("player")},
  pteam:v=>{ui.team=+v;render()},plevel:v=>{ui.level=+v;render()},
  startTurn:()=>{const ex={team:ui.team,level:ui.level,fromSec:!!ui.fromSec};if(ui.fromSec){ex.names=game.teams.map(t=>t.name);ex.teams=game.teams.length}newTurn("explain",nextQuarter(),ex)},
  joinSec:v=>newTurn("watch",fromSecond(+v),{}),
  cancelTurn:()=>{const back=turn&&turn.fromSec?"board":"player";turn=null;saveTurn();keepAwake(false);go(back)},
  mark:v=>{if(phase()!=="run")return;turn.marks.push({w:turn.cur.w,r:v});turn.cur=pick(turn.level);ui.flip=true;saveTurn();render()},
  undo:()=>{const m=turn.marks.pop();if(!m)return;if(turn.cur)seen.delete(turn.cur.w);LS.set("seen",[...seen]);turn.cur={w:m.w,d:turn.level};saveTurn();render()},
  bad:()=>{removed.add(turn.cur.w);LS.set("removed",[...removed]);toast("המילה הוצאה מהמאגר");turn.cur=pick(turn.level);ui.flip=true;saveTurn();render()},
  lastTeam:v=>{turn.last=+v;saveTurn();render()},
  toggle:v=>{const m=turn.marks[+v];m.r=m.r==="g"?"s":"g";saveTurn();render()},
  copy:()=>{const t=ui.msg;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("ההודעה הועתקה"),()=>toast("לא הצלחתי להעתיק. אפשר לכתוב ידנית."))},
  endTurn:()=>{turn=null;saveTurn();go("player")},
  endWatch:()=>{turn=null;saveTurn();go("player")},
  applyOwn:()=>{const t=tally(),tm=turn.team,l=turn.last;turn=null;saveTurn();applyResult(tm,t.net,l)},
  explainHere:()=>{ui.fromSec=true;ui.team=game.next;ui.level=levelOf(game.teams[game.next].pos);go("pick")},
  su:(v,b)=>{const k=b.dataset.k;ui.setup[k]=+v;render()},
  newGame:()=>{const u=ui.setup;document.querySelectorAll("[data-name]").forEach(i=>u.names[+i.dataset.name]=i.value.trim()||TEAM[+i.dataset.name].n);
    game={len:u.len,teams:Array.from({length:u.n},(_,i)=>({name:u.names[i],pos:1})),next:0,hist:[],winner:null};S.teams=u.n;saveS();saveGame();ui.setup=null;go("board")},
  rt:v=>{ui.rep.team=+v;render()},rn:v=>{ui.rep.net=Math.max(-20,Math.min(40,ui.rep.net+ +v));render()},rl:v=>{ui.rep.last=+v;render()},
  applyReport:()=>{const r=ui.rep;ui.rep=null;applyResult(r.team,r.net,r.last)},
  undoTurn:()=>{const h=game.hist.pop();if(!h)return;h.pos.forEach((p,i)=>game.teams[i].pos=p);game.next=h.next;game.winner=null;saveGame();toast("התור האחרון בוטל");render()},
  skipTurn:()=>{game.next=(game.next+1)%game.teams.length;saveGame();render()},
  fx:(v,b)=>{const t=game.teams[+b.dataset.i];t.pos=Math.max(1,Math.min(game.len,t.pos+ +v));saveGame();render()},
  resetGame:()=>{if(!confirm("להתחיל משחק חדש? הלוח הנוכחי יימחק."))return;game=null;saveGame();go("secSetup")},
  rematch:()=>{game.teams.forEach(t=>t.pos=1);game.hist=[];game.next=0;game.winner=null;saveGame();go("board")},
  set:(v,b)=>{const k=b.dataset.k;S[k]=isNaN(+v)?v:+v;saveS();render()},
  resetSeen:()=>{if(!confirm("לאפס את כל המילים שיצאו?"))return;seen.clear();LS.set("seen",[]);toast("המאגר אופס");render()},
  restoreBad:()=>{removed.clear();LS.set("removed",[]);toast("המילים חזרו למאגר");render()},
  nwl:v=>{ui.nwLevel=+v;const i=document.getElementById("nw"),val=i?i.value:"";render();document.getElementById("nw").value=val},
  addWord:()=>{const w=document.getElementById("nw").value.trim();if(!w)return toast("כתבו מילה");if(!ui.nwLevel)return toast("בחרו רמת קושי");
    if(pool().some(x=>x.w===w))return toast("המילה כבר במאגר");custom.push({w,d:ui.nwLevel,cat:"משפחתית",src:"family"});LS.set("custom",custom);if(SY&&syG())FB.api.push("games/"+SY.code+"/family",{w,d:ui.nwLevel});ui.nwLevel=0;toast("המילה נוספה");render()},
  delWord:v=>{custom.splice(+v,1);LS.set("custom",custom);render()},

function syPick(level){
  const g=syG(),st=(g&&g.meta&&g.meta.settings)||{},fam=g&&g.family?Object.values(g.family):[];
  const lv=Math.min(8,Math.max(1,+level||1));

  const lvl=all.filter(w=>w.d===lv&&!removed.has(w.w)&&!bad[wkey(w.w)]);
  const notInGame=w=>!used[wkey(w.w)],fresh=w=>notInGame(w)&&!seen.has(w.w);
  const choose=test=>{const base=lvl.filter(w=>w.src==="base"&&test(w)),pk=lvl.filter(w=>w.src!=="base"&&(st.packs||{})[w.src]!==false&&test(w));
    return (pk.length&&(Math.random()*100<(st.mix==null?20:st.mix)||!base.length))?pk:base};
  let p=choose(fresh);if(!p.length)p=lvl.filter(fresh);
  if(!p.length){ // כל מילות הרמה כבר יצאו בטלפון הזה: מאפסים את הזיכרון המקומי של הרמה
    lvl.forEach(w=>seen.delete(w.w));LS.set("seen",[...seen]);p=choose(notInGame);if(!p.length)p=lvl.filter(notInGame);
    if(p.length)toast("כל המילים ברמה "+lv+" כבר יצאו. הרמה אופסה.")}
  if(!p.length&&lvl.length){const clear={};lvl.forEach(w=>clear["used/"+wkey(w.w)]=null);syUpd(clear);p=lvl}
  if(!p.length)p=WORDS.filter(w=>!removed.has(w.w));
  if(!p.length)return {w:"אבחון: רמה "+lv+", מאגר "+WORDS.length+", יצאו "+Object.keys(used).length+", הוצאו "+removed.size,d:lv};
  const w=p[Math.floor(Math.random()*p.length)];
  seen.add(w.w);LS.set("seen",[...seen]);

}

${syIsHost()?`<div class="tools"><button class="btn small" data-act="go" data-v="syFix">תיקון ניקוד</button><button class="btn small" data-act="sySkip">העבר תור</button><button class="btn small" data-act="go" data-v="syPlayers">שחקנים</button><button class="btn small" data-act="leave">סיום משחק</button></div>`:""}`}
V.syFix=()=>{const g=syG();return `${hdr("sync")}<h2>תיקון ניקוד</h2>${g.teams.map((t,i)=>`<div class="field"><span class="lbl row">${token(i)}${esc(t.name)}</span><div class="stepper"><button data-act="syFx" data-i="${i}" data-v="-1">−</button><output>${t.pos}</output><button data-act="syFx" data-i="${i}" data-v="1">+</button></div></div>`).join("")}`};
V.syPlayers=()=>{const g=syG();return `${hdr("sync")}<h2>שחקנים</h2><div class="list">${Object.entries(g.players||{}).map(([id,p])=>`<div class="li"><span class="row">${token(p.team)}<b>${esc(p.name)}</b>${p.online===false?' <span class="muted">מנותק</span>':""}</span><span class="row">${p.ok?`<button class="btn small ghost" style="width:auto" data-act="moveTeam" data-v="${id}">קבוצה</button>`:`<button class="btn small" style="width:auto" data-act="approve" data-v="${id}">אשר</button>`}${id!==g.meta.host?`<button class="btn small ghost" style="width:auto" data-act="kick" data-v="${id}">הסר</button>`:""}</span></div>`).join("")}</div>`};

Object.assign(A,{
  sync:v=>{ui.mode=v;S.syncMode=v;go("syncHome")},
  jt:v=>{ui.jteam=+v;const c=document.getElementById("jc"),n=document.getElementById("jn");ui.joinCode=c?c.value:"";ui.myName=n?n.value:"";render()},
  doCreate:()=>{const u=ui.setup,n=document.getElementById("hn").value.trim();if(!n)return toast("כתבו את השם שלכם");
    document.querySelectorAll("[data-name]").forEach(i=>u.names[+i.dataset.name]=i.value.trim()||TEAM[+i.dataset.name].n);
    ui.myName=n;S.teams=u.n;saveS();syCreate(n,u.n,u.names,u.len,ui.mode||"room")},
  doJoin:()=>{const c=document.getElementById("jc").value.trim().toUpperCase(),n=document.getElementById("jn").value.trim();
    if(c.length<4)return toast("קוד המשחק הוא 4 תווים");if(!n)return toast("כתבו את השם שלכם");ui.myName=n;syJoin(c,n,ui.jteam||0)},
  rejoin:v=>{ui.joinCode=v;go("syncJoin")},
  shareLink:()=>{const t="בואו לשחק אליאס. קוד: "+SY.code+"\n"+syLink();
    if(navigator.share)navigator.share({text:t}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("הקישור הועתק"),()=>{});},
  approve:v=>syUpd({["players/"+v+"/ok"]:true}),
  kick:v=>FB.api.remove("games/"+SY.code+"/players/"+v),
  moveTeam:v=>{const g=syG(),p=g.players[v];syUpd({["players/"+v+"/team"]:(p.team+1)%g.teams.length})},
  startGame:()=>{const g=syG();const ok=Object.values(g.players||{}).filter(p=>p.ok);
    if(ok.length<2)return toast("צריך לפחות שני שחקנים מאושרים");
    const teams=new Set(ok.map(p=>p.team));if(teams.size<2)return toast("צריך שחקנים בשתי קבוצות לפחות");
    syUpd({"meta/phase":"play"})},
  syTurn:()=>syStartTurn(),
  syMark:v=>{const t=syTurn();if(!t)return;syUpd(v==="g"?{"turn/g":(t.g||0)+1}:{"turn/s":(t.s||0)+1});SW.cur=syPick(t.level);SW.flip=true;render()},
  syBad:()=>{if(SW.cur){removed.add(SW.cur.w);LS.set("removed",[...removed]);try{syUpd({["bad/"+wkey(SW.cur.w)]:true})}catch(e){}}toast("המילה הוצאה אצל כולם");SW.cur=syPick(syTurn().level);SW.flip=true;render()},
  syLast:v=>syEndTurn(+v),
  syPause:()=>syUpd({"turn/pauseAt":FB.api.now()}),
  syResume:()=>{const t=syTurn();syUpd({"turn/start":t.start+(FB.api.now()-t.pauseAt),"turn/pauseAt":null})},
  syCancel:()=>syUpd({turn:null}),
  sySkip:()=>{const g=syG();syUpd({"meta/next":{team:(((g.meta.next&&g.meta.next.team)||0)+1)%g.teams.length},turn:null})},
  syFx:(v,b)=>{const g=syG(),i=+b.dataset.i;syUpd({["teams/"+i+"/pos"]:Math.max(1,Math.min(g.meta.len,g.teams[i].pos+ +v))})},
  syRematch:()=>{const g=syG(),o={"meta/phase":"play","meta/winner":null,"meta/next":{team:0},turn:null};
    g.teams.forEach((t,i)=>o["teams/"+i+"/pos"]=1);syUpd(o)},
  leave:()=>syLeave(),
});

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const f=A[b.dataset.act];if(f)f(b.dataset.v,b)});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.pack){S.packs[t.dataset.pack]=t.checked;saveS()}if("night" in t.dataset){S.night=t.checked;saveS();render()}});

function syTick(){const g=syG(),t=g&&g.turn;if(!t||t.pauseAt)return;const now=FB.api.now();
  const ph=now<t.start?"wait":(now<t.start+t.dur?"run":"last");
  if(ph!==ui.sph){ui.sph=ph;if(ph==="last")buzz([400,120,400]);if(ph==="run")buzz(200);render();return}
  const cd=document.getElementById("cd");if(cd)cd.textContent=Math.max(0,Math.ceil((t.start-now)/1000));
  const ck=document.getElementById("clock");if(ck){const left=t.start+t.dur-now;ck.textContent=fmt(left);ck.classList.toggle("low",left<=10000)}}
/* resume after close */
if(turn){const ph=phase();if(ph==="done"||ph==="last"||ph==="run"||ph==="wait"||ph==="end")screen="turn";if(ph==="end"&&now()>turn.start+turn.dur+120000){turn=null;saveTurn();screen="home"}}
const urlCode=new URLSearchParams(location.search).get("g");
if(urlCode){ui.joinCode=urlCode.toUpperCase();ui.mode="room";screen="syncJoin"}
render();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("sw.js").then(r=>{r.update().catch(()=>{});setInterval(()=>r.update().catch(()=>{}),60000)}).catch(()=>{});navigator.serviceWorker.ready.then(()=>{swReady=true;if(screen==="home")render()})}
</script>
</body>
